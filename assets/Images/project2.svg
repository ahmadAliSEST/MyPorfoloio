<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="primaryGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff014f" />
      <stop offset="100%" stop-color="#ff4d79" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a1e0" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 H800 M0,100 H800 M0,150 H800 M0,200 H800 M0,250 H800 M0,300 H800 M0,350 H800 M0,400 H800" />
    <path d="M50,0 V450 M100,0 V450 M150,0 V450 M200,0 V450 M250,0 V450 M300,0 V450 M350,0 V450 M400,0 V450 M450,0 V450 M500,0 V450 M550,0 V450 M600,0 V450 M650,0 V450 M700,0 V450 M750,0 V450" />
  </g>

  <!-- App Header / Salesforce Navigation Bar -->
  <rect x="30" y="25" width="740" height="48" rx="8" fill="#1e293b" opacity="0.9" />
  <circle cx="58" cy="49" r="6" fill="#00a1e0" />
  <circle cx="75" cy="49" r="6" fill="#ff014f" />
  <rect x="98" y="42" width="120" height="14" rx="4" fill="#334155" />
  <rect x="235" y="44" width="60" height="10" rx="3" fill="#64748b" opacity="0.6" />
  <rect x="310" y="44" width="70" height="10" rx="3" fill="#64748b" opacity="0.6" />
  <rect x="395" y="44" width="85" height="10" rx="3" fill="#64748b" opacity="0.6" />
  <rect x="680" y="38" width="70" height="22" rx="11" fill="url(#primaryGrad2)" />

  <!-- Main Dashboard Card: Hospital Management 360 -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="90" width="460" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Header of Main Card -->
    <rect x="50" y="112" width="36" height="36" rx="8" fill="url(#blueGrad)" />
    <path d="M68 122 v16 M60 130 h16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="98" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">HealthCloud Patient 360</text>
    <text x="98" y="143" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Apex &amp; LWC Clinical Operations</text>
    
    <!-- Metrics Row -->
    <rect x="50" y="165" width="125" height="60" rx="8" fill="#1e293b" />
    <text x="65" y="187" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Admissions</text>
    <text x="65" y="213" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">1,248</text>

    <rect x="195" y="165" width="125" height="60" rx="8" fill="#1e293b" />
    <text x="210" y="187" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Bed Occupancy</text>
    <text x="210" y="213" fill="#4ade80" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">86.4%</text>

    <rect x="340" y="165" width="130" height="60" rx="8" fill="#1e293b" />
    <text x="355" y="187" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Appt. Queue</text>
    <text x="355" y="213" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">42 Active</text>

    <!-- Table / Record List Simulation -->
    <rect x="50" y="245" width="420" height="30" rx="6" fill="#1e293b" />
    <text x="65" y="265" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Patient: Robert Vance</text>
    <rect x="380" y="252" width="75" height="18" rx="9" fill="#0284c7" opacity="0.3" />
    <text x="393" y="265" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">INPATIENT</text>

    <rect x="50" y="285" width="420" height="30" rx="6" fill="#1e293b" opacity="0.7" />
    <text x="65" y="305" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Patient: Sarah Jenkins</text>
    <rect x="380" y="292" width="75" height="18" rx="9" fill="#16a34a" opacity="0.3" />
    <text x="393" y="305" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="600">DISCHARGED</text>

    <rect x="50" y="325" width="420" height="30" rx="6" fill="#1e293b" opacity="0.5" />
    <text x="65" y="345" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Patient: Michael Ross</text>
    <rect x="380" y="332" width="75" height="18" rx="9" fill="#eab308" opacity="0.3" />
    <text x="393" y="345" fill="#facc15" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SCHEDULED</text>

    <rect x="50" y="370" width="160" height="26" rx="6" fill="url(#primaryGrad2)" opacity="0.9" />
    <text x="75" y="387" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">+ Trigger Appointment Flow</text>
  </g>

  <!-- Side Card: Realtime Flow & Apex Triggers -->
  <g filter="url(#cardShadow)">
    <rect x="510" y="90" width="260" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <text x="530" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Automation Engine</text>
    <text x="530" y="142" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Triggered Flow &amp; Async Apex</text>
    
    <!-- Step 1 -->
    <circle cx="545" cy="175" r="10" fill="#22c55e" />
    <path d="M541 175 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="565" y="173" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Patient Intake Flow</text>
    <text x="565" y="186" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Automated SOQL verification</text>
    <path d="M545 190 v20" stroke="#334155" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Step 2 -->
    <circle cx="545" cy="225" r="10" fill="#00a1e0" />
    <path d="M541 225 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="565" y="223" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Doctor Assignment</text>
    <text x="565" y="236" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Round-robin Apex handler</text>
    <path d="M545 240 v20" stroke="#334155" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Step 3 -->
    <circle cx="545" cy="275" r="10" fill="#ff014f" />
    <text x="565" y="273" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Billing &amp; Insurance</text>
    <text x="565" y="286" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">REST API External Callout</text>

    <!-- Code Pill -->
    <rect x="530" y="325" width="220" height="70" rx="8" fill="#1e293b" />
    <text x="542" y="347" fill="#ff7b72" font-family="monospace" font-size="10">trigger <tspan fill="#79c0ff">PatientTrigger</tspan></text>
    <text x="542" y="362" fill="#79c0ff" font-family="monospace" font-size="10">on <tspan fill="#e6edf3">Patient__c (after insert)</tspan></text>
    <text x="542" y="377" fill="#7ee787" font-family="monospace" font-size="10">Handler.assignDoctor(Trigger.new);</text>
  </g>
</svg>

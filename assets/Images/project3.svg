<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="primaryGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff014f" />
      <stop offset="100%" stop-color="#ff5277" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)" />

  <!-- Background Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 H800 M0,100 H800 M0,150 H800 M0,200 H800 M0,250 H800 M0,300 H800 M0,350 H800 M0,400 H800" />
    <path d="M50,0 V450 M100,0 V450 M150,0 V450 M200,0 V450 M250,0 V450 M300,0 V450 M350,0 V450 M400,0 V450 M450,0 V450 M500,0 V450 M550,0 V450 M600,0 V450 M650,0 V450 M700,0 V450 M750,0 V450" />
  </g>

  <!-- App Header / Salesforce Lightning HR Navigation -->
  <rect x="30" y="25" width="740" height="48" rx="8" fill="#1f2937" opacity="0.9" />
  <circle cx="58" cy="49" r="6" fill="#10b981" />
  <circle cx="75" cy="49" r="6" fill="#ff014f" />
  <rect x="98" y="42" width="130" height="14" rx="4" fill="#374151" />
  <rect x="245" y="44" width="70" height="10" rx="3" fill="#6b7280" opacity="0.6" />
  <rect x="330" y="44" width="80" height="10" rx="3" fill="#6b7280" opacity="0.6" />
  <rect x="425" y="44" width="90" height="10" rx="3" fill="#6b7280" opacity="0.6" />
  <rect x="670" y="38" width="80" height="22" rx="11" fill="url(#primaryGrad3)" />

  <!-- Main Card: Candidate & Onboarding Pipeline -->
  <g filter="url(#cardShadow3)">
    <rect x="30" y="90" width="490" height="325" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
    
    <!-- Title -->
    <rect x="50" y="112" width="36" height="36" rx="8" fill="url(#emeraldGrad)" />
    <path d="M68 122 a6 6 0 1 0 0 12 a6 6 0 0 0 0 -12 M58 142 c0 -6 10 -9 20 -9 s20 3 20 9" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="98" y="128" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Talent Cloud &amp; HR Automation</text>
    <text x="98" y="143" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Recruitment, Approvals &amp; Employee Lifecycle</text>

    <!-- Kanban Columns Simulation -->
    <!-- Col 1: Applied -->
    <rect x="50" y="165" width="140" height="235" rx="8" fill="#1f2937" />
    <rect x="58" y="175" width="124" height="24" rx="4" fill="#374151" />
    <text x="68" y="191" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sourced (14)</text>
    
    <rect x="58" y="208" width="124" height="58" rx="6" fill="#111827" stroke="#4b5563" stroke-width="1"/>
    <text x="66" y="226" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Alex Carter</text>
    <text x="66" y="240" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Senior Salesforce Dev</text>
    <rect x="66" y="248" width="45" height="12" rx="3" fill="#3b82f6" opacity="0.3"/>
    <text x="72" y="257" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="8">LWC / Apex</text>

    <rect x="58" y="274" width="124" height="58" rx="6" fill="#111827" stroke="#4b5563" stroke-width="1"/>
    <text x="66" y="292" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Priya Sharma</text>
    <text x="66" y="306" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">CRM Consultant</text>
    <rect x="66" y="314" width="48" height="12" rx="3" fill="#10b981" opacity="0.3"/>
    <text x="72" y="323" fill="#34d399" font-family="system-ui, sans-serif" font-size="8">Flows / Admin</text>

    <!-- Col 2: Interviewing -->
    <rect x="200" y="165" width="140" height="235" rx="8" fill="#1f2937" />
    <rect x="208" y="175" width="124" height="24" rx="4" fill="#374151" />
    <text x="218" y="191" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tech Round (6)</text>
    
    <rect x="208" y="208" width="124" height="66" rx="6" fill="#111827" stroke="#ff014f" stroke-width="1"/>
    <text x="216" y="226" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">David Miller</text>
    <text x="216" y="240" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Integration Architect</text>
    <text x="216" y="254" fill="#ff014f" font-family="system-ui, sans-serif" font-size="9">Auto-Scheduled</text>

    <!-- Col 3: Offer & Onboarding -->
    <rect x="350" y="165" width="155" height="235" rx="8" fill="#1f2937" />
    <rect x="358" y="175" width="139" height="24" rx="4" fill="#374151" />
    <text x="368" y="191" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Hired &amp; Flow (3)</text>
    
    <rect x="358" y="208" width="139" height="85" rx="6" fill="#111827" stroke="#10b981" stroke-width="1"/>
    <text x="366" y="226" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Elena Rostova</text>
    <text x="366" y="240" fill="#34d399" font-family="system-ui, sans-serif" font-size="9">✓ Offer Letter Triggered</text>
    <text x="366" y="254" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">✓ IT Provisioning Created</text>
    <text x="366" y="268" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">✓ Welcome Email Sent</text>
  </g>

  <!-- Right Side Card: Approval Workflow & KPI -->
  <g filter="url(#cardShadow3)">
    <rect x="540" y="90" width="230" height="325" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="558" y="125" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Approval Workflows</text>
    <text x="558" y="142" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Multi-tier Leave &amp; Appraisal</text>

    <!-- Mini KPI Card 1 -->
    <rect x="555" y="165" width="200" height="55" rx="8" fill="#1f2937" />
    <text x="570" y="186" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Avg Onboarding Time</text>
    <text x="570" y="208" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">2.4 Days <tspan font-size="10" fill="#6b7280">(-65%)</tspan></text>

    <!-- Mini KPI Card 2 -->
    <rect x="555" y="230" width="200" height="55" rx="8" fill="#1f2937" />
    <text x="570" y="251" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Approvals Automated</text>
    <text x="570" y="273" fill="#ff014f" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">98.2%</text>

    <!-- Code Badge -->
    <rect x="555" y="295" width="200" height="105" rx="8" fill="#0f172a" />
    <text x="568" y="318" fill="#ff7b72" font-family="monospace" font-size="10">@InvocableMethod</text>
    <text x="568" y="335" fill="#79c0ff" font-family="monospace" font-size="10">public static void</text>
    <text x="568" y="352" fill="#d2a8ff" font-family="monospace" font-size="10">triggerOnboarding(</text>
    <text x="580" y="369" fill="#e6edf3" font-family="monospace" font-size="10">List&lt;Id&gt; empIds</text>
    <text x="568" y="386" fill="#d2a8ff" font-family="monospace" font-size="10">) { ... }</text>
  </g>
</svg>
